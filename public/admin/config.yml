# Panel de publicación de argcol.com.ar (Decap CMS).
# Los textos viven en src/content/posts/{seccion}/*.md.
#
# AUTENTICACIÓN
# Se usa DecapBridge (igual que en hmcanteros.com.ar) para entrar con Google
# sin ver GitHub. Para activarlo hay que registrar el sitio en
# https://decapbridge.com y reemplazar los valores marcados como PENDIENTE.
# Mientras tanto, el contenido se publica haciendo commit/push desde GitHub.
backend:
  name: git-gateway
  repo: argcolcapital-web/argcol-web
  branch: main
  # PENDIENTE: reemplazar por los datos que da el tablero de DecapBridge.
  # auth_type: pkce
  # base_url: https://auth.decapbridge.com
  # auth_endpoint: /sites/PENDIENTE/pkce
  # auth_token_endpoint: /sites/PENDIENTE/token
  # gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” via Decap CMS
    update: Update {{collection}} “{{slug}}” via Decap CMS
    delete: Delete {{collection}} “{{slug}}” via Decap CMS
    uploadMedia: Upload “{{path}}” via Decap CMS
    deleteMedia: Delete “{{path}}” via Decap CMS

local_backend: true

site_url: "https://argcol.com.ar"
locale: "es"

media_folder: "public/media/del-cms"
public_folder: "/media/del-cms"

slug:
  encoding: "ascii"
  clean_accents: true

publish_mode: "simple"

collections:
  - name: "mercado"
    label: "Mercado"
    folder: "src/content/posts/mercado"
    create: true
    editor: { preview: true }
    summary: "{{title}}"
    sortable_fields:
      - title
      - field: date
        label: "Fecha de publicación"
        default_sort: desc
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    fields: &post_fields
      - { label: "Sección (automática)", name: "section", widget: "hidden", default: "mercado" }
      - { label: "Título", name: "title", widget: "string", required: true }
      - label: "Fecha y hora de publicación"
        name: "date"
        widget: "datetime"
        required: true
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
      - label: "Dirección corta (slug)"
        name: "slug"
        widget: "string"
        required: true
        hint: "Minúsculas y guiones. Ej: cierre-de-mercados-15-noviembre-2026"
      - label: "Tipo de texto"
        name: "type"
        widget: "select"
        default: "articulo"
        options: ["articulo", "cierre-diario", "resumen-semanal", "analisis", "informe"]
      - { label: "Descripción corta", name: "description", widget: "text", required: false }
      - label: "Etiquetas"
        name: "tags"
        widget: "relation"
        required: false
        collection: "etiquetas"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "name"
        multiple: true
        create: false
      - { label: "Texto de la entrada", name: "body", widget: "markdown", required: true }
      - { label: "Foto destacada", name: "hero", widget: "image", required: false, allow_multiple: false }
      - { label: "Texto alternativo de la foto", name: "heroAlt", widget: "string", required: false }
      - { label: "Entrada original", name: "oldUrl", widget: "hidden", default: "" }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }

